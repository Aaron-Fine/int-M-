name: Catalog core

# The full regeneration and the independent cross-check of the period <=12
# catalog core (ADR 0014) take several minutes, so they run only when the core
# or its tools change, on every push to main, and on request. The fast check
# of the core's input hashes and digest runs in the CI workflow's quality job.
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/catalog_*.py'
      - 'tools/generate_catalog.py'
      - 'tools/generate_catalog_core.py'
      - 'tools/crosscheck_*.py'
      - 'tools/dump_angled_addresses.py'
      - 'fixtures/angled-addresses.p12.json'
      - 'tools/test_catalog_*.py'
      - 'tools/test_generate_catalog*.py'
      - 'tools/test_crosscheck_*.py'
      - '.github/workflows/catalog-core.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regenerate and cross-check the catalog core
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Regenerate the core and require byte equality (about 100 s)
        run: python3 tools/generate_catalog_core.py --check catalog

      - name: Cross-check the core and prove every ray pair's landing (a few minutes)
        run: python3 tools/crosscheck_catalog_core.py catalog

      - name: Check the pinned angled addresses (about 25 s)
        run: python3 tools/dump_angled_addresses.py --check fixtures/angled-addresses.p12.json
